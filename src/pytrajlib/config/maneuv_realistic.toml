[RUN]
run_name = "run_4"
num_runs = 30
num_runs_optimizer = 20
time_step_boost = 1e-4
time_step_lambert = 1e-3
time_step_midcourse = 1e-2
time_step_reentry = 1e-4
traj_output = 1
# Range is in meters
range = 10000000
# The aimpoint is superseded by the range
x_aim = -1106312.539916013
y_aim = 6274210.194440777
z_aim = 0
theta_long = 0.7938248075646784
theta_lat = 0.0

# 0 is modified Euler-Maruyama, 1 is SRA3
integrator = 1
random_seed = -1

[FLIGHT]
# Gravitational error model
grav_error = 1
# Use simplified drag (1 on, 0 off)
ballistic_drag = 0
# Atmospheric model. 0 is exponential, 1 is exponential with perturbations, 2 is EarthGram, 3 is mean EarthGram
atm_model = 2
# Positioning updates during exoatmospheric flight (1 is on, 0 is off)
gnss_nav = 1
# If set to 1, enables RV proportional navigation w/ realistic maneuverability, if set to 2, idealized maneuverability
rv_maneuv = 1
# Reentry velocity (m/s)
reentry_vel = 7500
# If 0, indicates realistic boost, 1 perfect
perfect_boost = 0
# If 1, optimize t_des_final/theta_long. If 0, use provided values directly.
optimize_boost = 0
# If 1, optimize the maneuver parameters with `rv_maneuv` forced to 1 during optimization:
# `max_deflection_angle`, `nav_gain_0`, `nav_gain_1`, `tau_deflect`, `K_q`, and `K_pp`.
optimize_maneuv = 0
t_des_final = 2530.768046590356
t_vert_boost = 10

[VEHICLE]
# Reentry vehicle type (0: ballistic, 1: maneuverable)
rv_type = 1
deflection_time = 0.02
actuator_force = 100
gearing_ratio = 1
actuator_resolution = 1e-3
max_deflection_angle = 0.26648956179316663
nav_gain_0 = 10.363583544701887
nav_gain_1 = 0.5945305847026036
tau_deflect = 0.6487016837700166
K_q = -39.11972966189953
K_pp = 41.73729867299631


# Vehicle parameter defaults (SWERVE RV + MMIII booster)
rv_mass = 450.0
rv_length = 2.75
rv_radius = 0.23
rv_c_d_0 = 0.0180
rv_c_d_alpha = 0.487
rv_c_m_delta = 0.059
booster_area = 2.2698
booster_maxdiam = 1.7
booster_c_d_0 = 0.15
booster_bus_mass = 100.0

[ERRORPARAMS]
initial_x_error = 0.0
initial_pos_error = 0.1
initial_vel_error = 1e-3
initial_angle_error = 1e-6
acc_scale_stability = 1e-6
gyro_bias_stability = 1e-8
gyro_noise = 1e-8
gnss_noise = 1e-1
# GNSS update frequency in Hz
gnss_freq = 1.0
cl_pert = 0
# Step function acceleration magnitude (m/s^2)
step_acc_mag = 0
# Step function acceleration height (m)
step_acc_hgt = 0
# Step function acceleration duration (s)
step_acc_dur = 0